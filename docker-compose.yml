# Full observability stack: the quiz service, Jaeger (OTLP traces),
# Prometheus (metrics) and Grafana (dashboards).
#
#   docker compose up --build
#
#   service     http://localhost:8080  (the bank at /v1, the game socket at /ws)
#               http://localhost:8081  (healthz, readyz, metrics: internal)
#   jaeger ui   http://localhost:16686 (service: quiz-service)
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3000  (anonymous login enabled)
#
# Tickets are signed with QUIZ_TICKET_KEY; mint one for yourself with
#   QUIZ_TICKET_KEY=... cargo run -p quiz-service --bin mint-ticket -- --role teacher --sub t1 --name Lan
# Both keys are required (at least 32 bytes), there is no default.

services:
  quiz-service:
    build: .
    image: quiz-service:latest
    environment:
      QUIZ_LISTEN_ADDR: 0.0.0.0:8080
      QUIZ_INTERNAL_ADDR: 0.0.0.0:8081
      QUIZ_DATABASE: /data/quiz.db
      QUIZ_TICKET_KEY: ${QUIZ_TICKET_KEY:?set QUIZ_TICKET_KEY (at least 32 bytes)}
      QUIZ_INTERNAL_KEY: ${QUIZ_INTERNAL_KEY:?set QUIZ_INTERNAL_KEY (at least 32 bytes)}
      QUIZ_ALLOWED_ORIGINS: ${QUIZ_ALLOWED_ORIGINS:-http://localhost:5173}
      QUIZ_LMS_URL: ${QUIZ_LMS_URL:-}
      QUIZ_TX_MODE: ${QUIZ_TX_MODE:-concurrent}
      QUIZ_OTEL_ENDPOINT: http://jaeger:4317
      RUST_LOG: info
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - quiz-data:/data
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/quiz.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  quiz-data:
