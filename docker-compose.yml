# Full observability stack: the quiz service, Jaeger (OTLP traces),
# Prometheus (metrics) and Grafana (dashboards).
#
#   docker compose up --build
#
#   service     http://localhost:8080  (GraphQL, playground at /playground)
#   jaeger ui   http://localhost:16686 (service: quiz-service)
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3000  (anonymous login enabled)
#
# The service seeds a demo user (demo/demo1234) and demo quiz on startup.

services:
  quiz-service:
    build: .
    image: quiz-service:latest
    environment:
      QUIZ_LISTEN_ADDR: 0.0.0.0:8080
      QUIZ_DATABASE: /data/quiz.db
      QUIZ_JWT_SECRET: ${QUIZ_JWT_SECRET:-change-me-in-production}
      QUIZ_SEED_DEMO: "1"
      QUIZ_TX_MODE: ${QUIZ_TX_MODE:-concurrent}
      QUIZ_OTEL_ENDPOINT: http://jaeger:4317
      RUST_LOG: info
    ports:
      - "8080:8080"
    volumes:
      - quiz-data:/data
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/quiz.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  quiz-data:
